name: Check cross-company review policy

on:
  workflow_run:
    workflows:
      - Cross-company review signal
    types:
      - completed

permissions:
  contents: read

jobs:
  resolve-pr:
    name: Resolve which PR triggered the signal workflow
    runs-on: ubuntu-24.04
    outputs:
      pull-number: ${{ steps.resolve.outputs.pull-number }}

    steps:
      - name: Resolve PR number
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const pullNumber = workflowRun.pull_requests?.[0]?.number;

            if (!pullNumber) {
              throw new Error(
                'No PR found in workflow_run.pull_requests'
              );
            }

            console.log(
              `PR #${pullNumber} found in workflow_run.pull_requests`
            );

            core.setOutput('pull-number', pullNumber);

  cross-company-review-policy:
    name: Check cross-company review policy
    needs: resolve-pr
    runs-on: ubuntu-24.04

    concurrency:
      group: cross-company-review-pr-${{ needs.resolve-pr.outputs.pull-number }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: read
      statuses: write

    env:
      CROSS_COMPANY_TEAMS: ${{ vars.CROSS_COMPANY_TEAMS }}
      # DO_NOT_SUBMIT
      TEST_CONFIG: ${{ vars.TEST_CONFIG }}

    steps:
      - name: Check cross-company review policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // DO_NOT_SUBMIT
            const testConfig = JSON.parse(process.env.TEST_CONFIG);

            const { owner, repo } = context.repo;
            const pullNumber =
              Number('${{ needs.resolve-pr.outputs.pull-number }}');

            // ------------------------------------------------------------
            // Fetch PR
            // ------------------------------------------------------------

            const { data: pullRequest } =
              await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });

            const pullAuthor = pullRequest.user.login;

            const statusContext = 'cross-company/approval';

            const statusSha =
              pullRequest.merge_commit_sha ??
              pullRequest.head.sha;

            console.log(`PR: #${pullNumber}`);
            console.log(`Author: ${pullAuthor}`);
            console.log(`Head SHA: ${pullRequest.head.sha}`);
            console.log(`Status SHA: ${statusSha}`);

            async function setPolicyStatus(state, description) {
              console.log(
                `${statusContext}: ${state} - ${description}`
              );

              await github.rest.repos.createCommitStatus({
                owner: owner,
                repo: repo,
                sha: statusSha,
                state: state,
                context: statusContext,
                target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                description: description,
              });
            }

            try {
              if (testConfig.fail_with_exception){
                throw new Error("Forced failure from test config");
              }
              // Invalidate any previous successful policy result while
              // checking the current PR state.
              await setPolicyStatus(
                'pending',
                'Checking cross-company review policy.'
              );

              if (testConfig.force_sleep){
                const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
                console.log("Sleeping 30 seconds");
                await sleep(30000)
              }

              // ------------------------------------------------------------
              // Parse team configuration
              // ------------------------------------------------------------

              const teamMembers = new Map(
                JSON.parse(process.env.CROSS_COMPANY_TEAMS)
                  .map(({ name, members }) => [
                    name,
                    new Set(members),
                  ])
              );

              const teams = [...teamMembers.keys()];

              console.log('Team members:', teamMembers);

              function getUserTeam(username) {
                const userTeams = teams.filter(
                  team => teamMembers.get(team).has(username)
                );

                if (userTeams.length > 1) {
                  throw new Error(
                    `User ${username} belongs to multiple configured teams: ` +
                    `${userTeams.join(', ')}`
                  );
                }

                return userTeams[0] ?? null;
              }

              function getAuthorTeam(username) {
                const userTeam = getUserTeam(username);

                if (userTeam === null) {
                  throw new Error(
                    `User ${username} does not belong to any of the configured ` +
                    `teams: ${teams.join(', ')}`
                  );
                }

                return userTeam;
              }

              function computeApproverTeamMap(approvers) {
                const approverToTeam = new Map();

                for (const approver of approvers) {
                  const team = getUserTeam(approver);

                  if (team !== null) {
                    approverToTeam.set(approver, team);
                  }
                }

                console.log(
                  'Approver to team:',
                  approverToTeam
                );

                return approverToTeam;
              }

              // ------------------------------------------------------------
              // Fetch reviews
              // ------------------------------------------------------------

              // GitHub returns the reviews in chronological order.
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                {
                  owner,
                  repo,
                  pull_number: pullNumber,
                  per_page: 100,
                }
              );

              // ------------------------------------------------------------
              // Calculate effective state for every reviewer
              // ------------------------------------------------------------

              const reviewStates = new Map();

              for (const review of reviews) {
                const username = review.user.login;

                if (
                  review.state === 'APPROVED' ||
                  review.state === 'CHANGES_REQUESTED' ||
                  review.state === 'DISMISSED'
                ) {
                  reviewStates.set(
                    username,
                    review.state
                  );
                }
              }

              // ------------------------------------------------------------
              // Get effective approvers, excluding PR author
              // ------------------------------------------------------------

              const prApprovers = new Set(
                [...reviewStates.entries()]
                  .filter(
                    ([username, state]) =>
                      username !== pullAuthor &&
                      state === 'APPROVED'
                  )
                  .map(([username]) => username)
              );

              console.log(
                `Effective approvers for PR ${pullNumber} ` +
                `authored by ${pullAuthor}: ` +
                `${[...prApprovers].join(', ')}`
              );

              // ------------------------------------------------------------
              // Calculate author and approver teams
              // ------------------------------------------------------------

              const authorTeam =
                getAuthorTeam(pullAuthor);

              const approverToTeam =
                computeApproverTeamMap(prApprovers);

              const crossCompanyTeams =
                teams.filter(
                  team => team !== authorTeam
                );

              console.log(
                `Author team: ${pullAuthor} - ${authorTeam}`
              );

              console.log(
                `Candidate cross-company teams: ` +
                `${crossCompanyTeams.join(', ')}`
              );

              // ------------------------------------------------------------
              // Find cross-company approvers
              // ------------------------------------------------------------

              const crossCompanyApprovers =
                [...approverToTeam.entries()]
                  .filter(
                    ([_, team]) =>
                      crossCompanyTeams.includes(team)
                  )
                  .map(([approver]) => approver);

              // ------------------------------------------------------------
              // Publish policy result
              // ------------------------------------------------------------

              if (crossCompanyApprovers.length === 0 && testConfig.fail_approval) {
                await setPolicyStatus(
                  'failure',
                  'Cross-company approval is still required.'
                );

                core.setFailed(
                  `Cross-company review policy not met: ` +
                  `PR author ${pullAuthor} belongs to team '${authorTeam}', ` +
                  `and the PR has not been approved by any reviewers ` +
                  `belonging to teams from other companies: ` +
                  `${crossCompanyTeams.join(', ')}.`
                );

                return;
              }

              await setPolicyStatus(
                'success',
                'Cross-company approval requirement satisfied.'
              );

              core.summary.addHeading(
                'Cross-company review policy satisfied.',
                '3'
              );
              core.summary.addEOL();
              core.summary.addRaw(
                'Cross-company approver(s):'
              );
              core.summary.addList(
                crossCompanyApprovers
              );

              console.log(
                core.summary.stringify()
              );

              core.summary.write();

            } catch (error) {
              core.error(
                `Unable to check cross-company review policy: ` +
                `${error.message}`
              );

              // Don't leave a stale "pending" status if the checker
              // itself fails unexpectedly.
              try {
                await setPolicyStatus(
                  'error',
                  'Unable to check cross-company review policy.'
                );
              } catch (statusError) {
                core.error(
                  `Unable to publish error status: ` +
                  `${statusError.message}`
                );
              }

              throw error;
            }

      - name: Print GitHub API rate limit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "GitHub API rate limit:"
          gh api rate_limit \
            --jq '
              .resources
              | to_entries[]
              | "\(.key): remaining=\(.value.remaining)/\(.value.limit), used=\(.value.used), reset=\(.value.reset)"
            '
