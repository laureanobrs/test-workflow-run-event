name: Signal cross-company review check

on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

# This workflow needs no permissions. It is just a trigger for check-cross-company-review-policy.yml
permissions: {}

jobs:
  signal-cross-company-check:
    name: Signal cross-company review check
    runs-on: ubuntu-24.04
    steps:
      - name: Signal cross-company review check
        run: |
          echo "Event: ${{ github.event_name }}"
